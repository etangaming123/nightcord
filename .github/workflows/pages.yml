name: Deploy homepage and client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["client/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The homepage at the root, the client under /app/.
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R client/. _site/app/
          rm -rf _site/app/tests _site/app/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
