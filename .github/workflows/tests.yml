name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: pytest
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in client/js/*.js client/js/ui/*.js; do node --check "$f"; done
      - name: Markdown tokenizer
        run: node client/tests/markdown.test.mjs
      - name: UI strings
        run: node client/tests/lang-keys.mjs
